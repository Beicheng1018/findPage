<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171921" media="(prefers-color-scheme: dark)" />
    <title>单词书查询</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page-shell">
      <section class="search-card" aria-labelledby="page-title">
        <p class="eyebrow">WORD BOOK</p>
        <h1 id="page-title">单词书查询</h1>
        <p class="intro">输入英文单词，快速找到它所在的页码。</p>

        <form id="search-form" class="search-form" role="search" novalidate>
          <label class="sr-only" for="word-input">查询单词</label>
          <div class="input-wrap">
            <input
              id="word-input"
              name="word"
              type="search"
              inputmode="text"
              autocomplete="off"
              autocapitalize="none"
              spellcheck="false"
              placeholder="输入单词，例如 vocabulary"
              aria-describedby="search-hint"
              aria-controls="suggestion-list"
            />
            <button id="clear-button" class="clear-button" type="button" aria-label="清空输入" hidden>
              <span aria-hidden="true">×</span>
            </button>
          </div>
          <p id="search-hint" class="sr-only">输入时会显示匹配的单词建议</p>
        </form>

        <p id="status-message" class="status-message" role="status">正在加载单词索引……</p>
        <ul id="suggestion-list" class="suggestion-list" aria-label="匹配的单词"></ul>
        <section id="result" class="result" aria-live="polite" hidden></section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
